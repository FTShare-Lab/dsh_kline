name: Release packages

on:
  push:
    tags: ['v0.6.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version or release-candidate tag to validate and draft
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-and-draft:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Verify release tag and package version
        run: |
          node -e 'const version=require("./package.json").version; const tag=process.env.RELEASE_TAG; if(tag !== `v${version}` && !new RegExp(`^v${version.replaceAll(".", "\\.")}-rc\\.[1-9]\\d*$`).test(tag)){console.error(`Release tag ${tag} does not match package ${version}`); process.exit(1)}'
          echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm build:sidebar

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Verify all Node and Python behavior
        env:
          DSH_KLINE_TEST_PYTHON: python
        run: pnpm test

      - name: Build both release assets and checksums
        run: |
          pnpm pack:release
          pnpm pack:codex
          pnpm verify:codex-marketplace
          (cd release && sha256sum "dsh-kline-v${VERSION}.tgz" > "dsh-kline-v${VERSION}.tgz.sha256")
          (cd release && sha256sum "ft-kline-v${VERSION}.zip" > "ft-kline-v${VERSION}.zip.sha256")

      - name: Smoke-test both clean packages
        run: |
          node scripts/smoke-packed-install.mjs "release/dsh-kline-v${VERSION}.tgz"
          node scripts/smoke-dsh-profile.mjs "release/dsh-kline-v${VERSION}.tgz"
          node scripts/smoke-dsh-profile.mjs "release/dsh-kline-v${VERSION}.tgz" --nested
          python scripts/smoke-codex-package.py "release/ft-kline-v${VERSION}.zip"
          python scripts/smoke-codex-package.py marketplace/ft-kline

      - name: Create draft release for manual verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release/dsh-kline-v${VERSION}.tgz" "release/dsh-kline-v${VERSION}.tgz.sha256" \
            "release/ft-kline-v${VERSION}.zip" "release/ft-kline-v${VERSION}.zip.sha256" \
            --draft --title "$RELEASE_TAG · FT K-Line" --notes-file "docs/release-notes-v${VERSION}.md"

# Deliberately no published-release trigger: a maintainer verifies hashes and
# Desktop evidence and downloaded asset hashes before publishing the draft.
