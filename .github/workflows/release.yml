name: Release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and attach the package to
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the released source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Verify tag and package version
        run: |
          node -e 'const version=require("./package.json").version; const expected=`v${version}`; if(process.env.RELEASE_TAG!==expected){console.error(`Release tag ${process.env.RELEASE_TAG} does not match package ${expected}`); process.exit(1)}'

      - name: Install and build
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
          pnpm build:sidebar

      - name: Verify Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Create stable release asset
        run: |
          pnpm pack:release
          sha256sum release/dsh-kline.tgz > release/dsh-kline.tgz.sha256
          tar -tzf release/dsh-kline.tgz | grep -q '^package/scripts/run-dsh-kline.sh$'
          tar -tzf release/dsh-kline.tgz | grep -q '^package/requirements.txt$'
          tar -tzf release/dsh-kline.tgz | grep -q '^package/lib/index.js$'

      - name: Attach assets to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release/dsh-kline.tgz release/dsh-kline.tgz.sha256 --clobber
