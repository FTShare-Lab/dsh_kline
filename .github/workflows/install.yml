name: Cross-platform install

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-2025
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:sidebar

      - name: Verify Python and launcher behavior
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
          pnpm test:launcher
          node --test tests/session-route.test.ts

      - name: Exercise the packed ordinary-user install
        run: |
          pnpm pack:release
          node scripts/smoke-packed-install.mjs release/dsh-kline.tgz
          node scripts/smoke-dsh-profile.mjs release/dsh-kline.tgz
