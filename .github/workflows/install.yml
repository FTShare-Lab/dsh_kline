name: Cross-platform install

on:
  pull_request:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:sidebar

      - name: Confirm clean TA-Lib starting point
        run: python -c "import importlib.util; assert importlib.util.find_spec('talib') is None, 'TA-Lib Python module was preinstalled'"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify pinned TA-Lib installation
        run: python -c "import talib; assert talib.__version__ == '0.8.2'"

      - name: Verify all Node and Python behavior
        env:
          DSH_KLINE_TEST_PYTHON: python
        run: pnpm test

      - name: Create the release package
        run: |
          pnpm pack:release
          pnpm pack:codex

      - name: Exercise the packed ordinary-user install
        run: node scripts/smoke-packed-install.mjs release/dsh-kline-v0.6.0.tgz

      - name: Exercise the plugin inside an isolated DSH Web profile
        run: node scripts/smoke-dsh-profile.mjs release/dsh-kline-v0.6.0.tgz

      - name: Exercise isolated Codex package paths
        run: python scripts/smoke-codex-package.py release/ft-kline-v0.6.0.zip
