  .percent-tick { position: absolute; right: 2px; transform: translateY(-50%); padding: 0 2px; background: color-mix(in srgb, var(--bg) 88%, transparent); }
  .percent-tick.up { color: var(--up); }
  .percent-tick.down { color: var(--down); }
  .percent-tick.flat { color: var(--text-soft); }
  .cards {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .card {
    flex: 1 1 110px; min-width: 110px; padding: 8px 10px;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
  }
  .card .k { font-size: 11px; color: var(--text-soft); }
  .card .v { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .card .v.down { color: var(--down); }
  .card .v.up { color: var(--up); }
  .tables { padding: 10px 12px; border-bottom: 1px solid var(--border); max-height: 220px; overflow-y: auto; }
  .tables .t-title { font-size: 12px; color: var(--text-soft); margin-bottom: 4px; }
  table.t { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 12px; }
  table.t th, table.t td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  table.t th { background: var(--bg-soft); font-weight: 600; }
  #rangeBanner {
    position: absolute; left: 50%; transform: translateX(-50%); top: 10px;
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: var(--bg); border: 1px solid var(--accent); border-radius: 8px;
    box-shadow: var(--shadow); z-index: 5; font-size: 12px;
  }
  #rangeBanner #rangeText { color: var(--text); font-weight: 500; }
  .alert-menu-wrap { position: relative; }
  .alert-popover, .chart-context-menu {
    display: none; position: absolute; z-index: 22; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); box-shadow: var(--shadow); color: var(--text);
  }
  .alert-popover.open, .chart-context-menu.open { display: block; }
  .alert-popover { top: calc(100% + 5px); right: 0; width: 248px; padding: 8px; }
  .alert-fields { display: grid; grid-template-columns: 1fr 1fr auto; gap: 5px; }
  .alert-fields input { min-width: 0; height: 28px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-soft); color: var(--text); font: inherit; font-size: 11px; }
  .alert-list { max-height: 150px; margin-top: 7px; overflow-y: auto; }
  .alert-empty { padding: 5px 1px; color: var(--text-soft); font-size: 11px; }
  .alert-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px; align-items: center; padding: 5px 1px; border-top: 1px solid var(--border); font-size: 11px; }
  .alert-item-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart-context-menu { min-width: 142px; padding: 4px; }
  .chart-context-menu button { display: block; width: 100%; min-height: 30px; padding: 5px 8px; border: 0; border-radius: 4px; background: transparent; color: var(--text); text-align: left; cursor: pointer; font: inherit; font-size: 12px; }
  .chart-context-menu button:hover { background: var(--bg-soft); }
  .compare-menu-wrap, .drawing-menu-wrap { position: relative; }
  .compare-popover, .drawing-popover { display: none; position: absolute; z-index: 22; top: calc(100% + 5px); right: 0; width: 270px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); box-shadow: var(--shadow); }
  .compare-popover.open, .drawing-popover.open { display: block; }
  .compare-fields, .drawing-fields { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px; }
  .compare-fields input, .drawing-fields input { min-width: 0; height: 28px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-soft); color: var(--text); font: inherit; font-size: 11px; }
  .compare-presets, .drawing-types { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .compare-mode { display: flex; gap: 0; margin-top: 7px; overflow: hidden; border: 1px solid var(--border); border-radius: 4px; }
  .compare-mode button { min-height: 25px; flex: 1; border: 0; border-radius: 0; background: var(--bg-soft); font-size: 10px; }
  .compare-mode button + button { border-left: 1px solid var(--border); }
  .compare-mode button.active { background: var(--accent); color: #fff; }
  .compare-presets button, .drawing-types button { min-height: 25px; padding: 3px 6px; font-size: 10px; }
  .compare-list, .drawing-list { max-height: 130px; margin-top: 7px; overflow-y: auto; }
  .compare-item, .drawing-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px; align-items: center; padding: 5px 1px; border-top: 1px solid var(--border); font-size: 11px; }
  .compare-item-main, .drawing-item-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comparison-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; margin-top: 7px; }
  .comparison-stat { min-width: 0; padding: 5px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-soft); font-size: 10px; }
  .comparison-stat-label { display: block; overflow: hidden; color: var(--text-soft); text-overflow: ellipsis; white-space: nowrap; }
  .comparison-stat-value { display: block; margin-top: 2px; color: var(--text); font-size: 11px; font-variant-numeric: tabular-nums; }
  .comparison-layer { display: none; }
  .comparison-legend { display: none; }
  .comparison-legend-item { padding: 1px 4px; border-radius: 3px; background: color-mix(in srgb, var(--bg) 88%, transparent); font-variant-numeric: tabular-nums; }
  .comparison-performance { display: grid; grid-template-columns: 176px minmax(0, 1fr); min-height: 112px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--bg); }
  .comparison-performance[hidden] { display: none; }
  .comparison-performance-head { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 10px 12px; border-right: 1px solid var(--border); }
  .comparison-performance-title { color: var(--text); font-size: 12px; font-weight: 700; }
  .comparison-performance-subtitle { color: var(--text-soft); font-size: 10px; }
  .comparison-performance-legend { display: grid; gap: 5px; color: var(--text-soft); font-size: 10px; font-variant-numeric: tabular-nums; }
  .comparison-performance-legend span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comparison-performance-canvas { position: relative; min-width: 0; min-height: 112px; }
  .comparison-performance-svg { display: block; width: 100%; height: 112px; }
  .comparison-performance-zero { stroke: var(--border); stroke-dasharray: 3 3; }
  .comparison-performance-value { fill: var(--text-soft); font-size: 10px; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .comparison-performance { grid-template-columns: 1fr; }
    .comparison-performance-head { min-height: 60px; border-right: 0; border-bottom: 1px solid var(--border); }
  }
  /* MA/VWAP render as native price indicators, sharing KLineChart's exact
     pane transform while panning, zooming and resizing. */
  .ma-layer { display: none; }
  .crosshair-time-label { position: absolute; z-index: 9; bottom: auto; transform: translateX(-50%); padding: 2px 5px; border-radius: 3px; background: var(--text); color: var(--bg); font-size: 10px; font-variant-numeric: tabular-nums; pointer-events: none; white-space: nowrap; }
  .activity-notice { position: absolute; z-index: 30; top: 52px; right: 30px; display: flex; align-items: center; gap: 8px; max-width: min(360px, calc(100% - 56px)); padding: 8px 11px; border: 1px solid var(--border); border-radius: 6px; background: color-mix(in srgb, var(--bg) 94%, transparent); box-shadow: var(--shadow); color: var(--text); font-size: 12px; font-weight: 650; pointer-events: none; }
  .activity-notice[hidden] { display: none; }
  .activity-notice-spinner { width: 14px; height: 14px; flex: 0 0 auto; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: ticker-spin .7s linear infinite; }
  .activity-notice.complete .activity-notice-spinner, .activity-notice.failed .activity-notice-spinner { border: 0; animation: none; }
  .activity-notice.complete .activity-notice-spinner::before { content: "\\2713"; color: var(--success); font-size: 16px; line-height: 14px; }
  .activity-notice.failed .activity-notice-spinner::before { content: "!"; color: var(--danger); font-size: 16px; line-height: 14px; }
  .user-drawing-layer { position: absolute; z-index: 4; inset: 0 64px 0 0; pointer-events: none; overflow: hidden; }
  .user-horizontal-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--info); }
  .user-horizontal-line span { position: absolute; top: -15px; right: 4px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 1px 4px; border-radius: 2px; background: var(--info); color: #fff; font-size: 10px; }
  .drawing-capture-layer { position: absolute; z-index: 8; inset: 0 64px 0 0; display: none; cursor: crosshair; }
  .drawing-capture-layer.active { display: block; }
  .security-nav { display: flex; align-items: center; gap: 18px; min-height: 42px; padding: 0 12px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .security-nav::-webkit-scrollbar, .company-tabbar::-webkit-scrollbar { display: none; }
  .security-nav-tab { position: relative; flex: 0 0 auto; height: 42px; padding: 0; border: 0; background: transparent; color: var(--text-soft); cursor: pointer; font: inherit; font-size: 13px; font-weight: 650; }
  .security-nav-tab:hover { color: var(--text); }
  .security-nav-tab.active { color: var(--text); }
  .security-nav-tab.active::after { content: ""; position: absolute; right: 0; bottom: 0; left: 0; height: 2px; background: var(--accent); }
  .security-nav-count { display: inline-grid; min-width: 16px; margin-left: 3px; padding: 0 3px; place-items: center; border-radius: 8px; background: var(--bg-soft); color: var(--text-soft); font-size: 9px; font-weight: 700; vertical-align: 1px; }
  .security-panel[hidden] { display: none; }
  .insight-panel { min-height: 0; padding: 0 12px 24px; }
  .insight-source { color: var(--text-soft); font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .insight-source.mock { color: var(--warn); }
  .insight-source-footer { display: flex; align-items: center; justify-content: flex-end; min-height: 32px; margin-top: 18px; padding-top: 9px; border-top: 1px solid var(--border); }
  .news-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 18px; padding: 13px 0; border-top: 1px solid var(--border); }
  .news-item:first-child { border-top: 0; }
  .news-item-title { overflow: hidden; color: var(--text); font-size: 14px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  .news-item-summary { grid-column: 1 / 2; overflow: hidden; color: var(--text-soft); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .news-meta { align-self: center; color: var(--text-soft); font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .news-kind { display: inline-block; min-width: 52px; margin-right: 7px; color: var(--accent); font-size: 10px; font-weight: 700; }
  .company-tabbar { display: flex; gap: 5px; min-height: 50px; padding: 10px 0; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .company-tab { flex: 0 0 auto; min-height: 29px; padding: 4px 10px; border: 1px solid transparent; border-radius: 4px; background: var(--bg-soft); color: var(--text-soft); cursor: pointer; font: inherit; font-size: 12px; font-weight: 650; }
  .company-tab:hover { color: var(--text); border-color: var(--border); }
  .company-tab.active { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); color: var(--text); border-color: color-mix(in srgb, var(--accent) 22%, var(--border)); }
  .company-content { padding-top: 18px; }
  .company-section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .company-section-heading h3 { margin: 0; font-size: 15px; font-weight: 750; }
  .company-section-heading span { color: var(--text-soft); font-size: 10px; }
  .company-metrics { display: grid; grid-template-columns: repeat(5, minmax(112px, 1fr)); border: 1px solid var(--border); }
  .company-metric { min-width: 0; padding: 11px 12px; border-right: 1px solid var(--border); }
  .company-metric:last-child { border-right: 0; }
  .company-metric-label { display: block; overflow: hidden; color: var(--text-soft); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
  .company-metric-value { display: block; overflow: hidden; margin-top: 3px; color: var(--text); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap; }
  .company-metric-value.up { color: var(--up); } .company-metric-value.down { color: var(--down); }
  .company-detail-section { margin-top: 22px; }
  .company-detail-section h3 { margin: 0 0 9px; color: var(--text-soft); font-size: 11px; font-weight: 700; }
  .company-detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
  .company-detail { display: grid; gap: 3px; min-width: 0; min-height: 58px; padding: 9px 10px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .company-detail-label { overflow: hidden; color: var(--text-soft); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
  .company-detail-value { overflow: hidden; color: var(--text); font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
  .company-info-table, .company-data-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .company-info-table { margin-top: 18px; border: 1px solid var(--border); }
  .company-info-table th, .company-info-table td { padding: 9px 11px; border: 1px solid var(--border); text-align: left; }
  .company-info-table th { width: 15%; color: var(--text-soft); background: var(--bg-soft); font-size: 11px; font-weight: 650; }
  .company-info-table td { width: 35%; font-size: 12px; }
  .company-description { margin: 18px 0 0; color: var(--text-soft); font-size: 12px; line-height: 1.75; }
  .company-data-table { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .company-data-table th, .company-data-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  .company-data-table th:first-child, .company-data-table td:first-child { padding-left: 0; text-align: left; }
  .company-data-table th:last-child, .company-data-table td:last-child { padding-right: 0; }
  .company-data-table tr:last-child td { border-bottom: 0; }
  .company-data-table th { color: var(--text-soft); font-size: 10px; font-weight: 650; }
  .company-data-table td { font-size: 12px; }
  .company-data-table .up { color: var(--up); } .company-data-table .down { color: var(--down); }
  .holder-layout { display: grid; grid-template-columns: minmax(220px, 0.72fr) minmax(0, 1.28fr); gap: 24px; align-items: start; }
  .holder-summary { border-top: 1px solid var(--border); }
  .holder-summary-row { display: grid; grid-template-columns: minmax(0, 1fr) 68px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .holder-summary-name { overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .holder-summary-track { height: 5px; margin-top: 5px; overflow: hidden; background: var(--bg-soft); }
  .holder-summary-fill { height: 100%; background: var(--info); }
  .holder-summary-value { color: var(--text-soft); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
  .insight-empty { display: grid; min-height: 270px; place-items: center; color: var(--text-soft); font-size: 12px; text-align: center; }
  .err { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--danger); padding: 8px 12px; }
  .err-message { min-width: 0; overflow-wrap: anywhere; }
  .err .btn { flex: 0 0 auto; }
  .group-dialog-backdrop { position: fixed; z-index: 70; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(12, 17, 25, .35); }
  .group-dialog-backdrop[hidden] { display: none; }
  .group-dialog { width: min(320px, 100%); padding: 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); box-shadow: var(--shadow); }
  .group-dialog-title { margin: 0 0 10px; font-size: 14px; }
  .group-dialog-input { width: 100%; height: 32px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-soft); color: var(--text); font: inherit; }
  .group-dialog-error { min-height: 18px; margin-top: 5px; color: var(--danger); font-size: 11px; }
  .group-dialog-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
  @media (max-width: 760px) {
    .workspace-bar { flex-wrap: wrap; }
    .brand { min-width: 0; }
    .workspace-tabs { order: 3; flex-basis: 100%; }
    .symbol-search { margin-left: 0; flex: 1 1 180px; min-width: 0; max-width: none; }
    .toolbar-hint { display: none; }
    .toolbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .toolbar::-webkit-scrollbar { display: none; }
    .toolbar-actions { width: max-content; flex-wrap: nowrap; justify-content: flex-start; }
    .company-metrics { grid-template-columns: repeat(3, minmax(112px, 1fr)); }
    .company-detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .company-metric:nth-child(3) { border-right: 0; }
    .company-metric:nth-child(-n+3) { border-bottom: 1px solid var(--border); }
    .holder-layout { grid-template-columns: 1fr; gap: 18px; }
  }
  @media (max-width: 980px) {
    #viewShell.watchlist-rail-open #viewScroll { padding-left: 0; }
    .watchlist-rail, .watchlist-rail-toggle { display: none; }
  }
  @media (max-width: 480px) {
    .workspace-bar { gap: 5px; padding: 6px 8px; }
    .header-controls { gap: 3px; }
    header.bar {
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      align-items: center; gap: 6px; padding-inline: 8px;
    }
    header.bar .row { min-width: 0; flex-wrap: nowrap; gap: 5px; }
    header.bar .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header.bar .chip { padding-inline: 5px; }
    header.bar .quote { display: grid; grid-template-columns: auto; justify-items: end; gap: 0; }
    header.bar .close { font-size: 17px; line-height: 1.2; white-space: nowrap; }
    header.bar .change { font-size: 11px; line-height: 1.2; white-space: nowrap; }
    header.bar .quote-meta { display: none; }
    .timebar { padding-inline: 8px; }
    .toolbar { padding-inline: 8px; }
    .range-custom-popover { left: 8px; }
    .brand { min-width: auto; }
    .brand-product { font-size: 11px; }
    .security-nav { gap: 15px; padding-inline: 8px; }
    .insight-panel { padding-inline: 8px; }
    .company-metrics { grid-template-columns: repeat(2, minmax(112px, 1fr)); }
    .company-detail-grid { grid-template-columns: 1fr; }
    .company-metric { border-bottom: 1px solid var(--border); }
    .company-metric:nth-child(2n) { border-right: 0; }
    .company-metric:nth-last-child(-n+1) { border-bottom: 0; }
    .company-info-table th, .company-info-table td { padding: 8px 7px; }
    .company-info-table th { width: 23%; }
    .news-item { gap: 4px 10px; }
    .news-item-summary { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div id="viewShell">
<div id="viewScroll">
<div id="viewContent">
<div class="workspace-bar">
  <div class="brand" id="productBrand" aria-label="dsh_kline Chart"><img class="brand-logo" src="__FTV_LOGO_DATA__" alt="" /><span class="brand-product" id="brandProduct">dsh_kline Chart</span></div>
  <div class="workspace-tabs" id="workspaceTabs" role="tablist" aria-label="Chart workspace tabs"></div>
  <div class="symbol-search" id="symbolSearch">
    <form class="symbol-search-form" id="symbolSearchForm" role="search">
      <input id="symbolSearchInput" type="search" autocomplete="off" spellcheck="false" placeholder="搜索代码或名称" aria-label="搜索股票" />
      <button class="btn" id="symbolSearchBtn" type="submit">搜索</button>
    </form>
    <div class="search-results" id="searchResults" role="listbox"></div>
  </div>
  <button class="btn icon-btn watchlist-rail-toggle" id="watchlistRailToggle" type="button" title="展开自选侧栏" aria-label="展开自选侧栏" aria-expanded="false">&#9776;</button>
  <div class="watchlist-wrap">
    <button class="btn icon-btn watchlist-toggle" id="watchlistBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="自选列表" aria-label="自选列表">&#9734;</button>
    <div class="watchlist-popover" id="watchlistPopover" role="menu" aria-label="自选列表">
      <div class="watchlist-heading"><span id="watchlistHeading">自选</span><span class="watchlist-count" id="watchlistCount"></span></div>
      <div class="watchlist-groupbar">
        <select class="watchlist-group-select" id="watchlistGroupSelect" aria-label="自选分组"></select>
        <button class="btn watchlist-group-action" id="watchlistGroupAddBtn" type="button" title="新建分组" aria-label="新建分组">+</button>
        <button class="btn watchlist-group-action" id="watchlistGroupDeleteBtn" type="button" title="删除分组" aria-label="删除分组">&times;</button>
      </div>
      <div class="watchlist-items" id="watchlistItems"></div>
    </div>
  </div>
  <div class="header-controls">
    <button class="btn language-btn" id="languageToggle" title="切换至 English" aria-label="切换至 English">EN</button>
    <button class="btn icon-btn" id="themeToggle" title="切换至夜间模式" aria-label="切换至夜间模式">&#9789;</button>
    <button class="btn icon-btn" id="expandBtn" aria-label="展开图表" title="展开图表">&#x26F6;</button>
  </div>
</div>
<header class="bar">
  <div class="row">
    <span class="title" id="name">dsh_kline</span>
    <span class="chip" id="symbolChip">—</span>
    <button class="btn icon-btn watchlist-toggle" id="watchCurrentBtn" type="button" title="加入自选" aria-label="加入自选">&#9734;</button>
  </div>
  <div class="quote">
    <span class="close" id="qClose">--</span>
    <span class="change" id="qChange">--</span>
    <span class="quote-meta" id="qMeta"></span>

function sanitizeToolArguments(args = {}) {
  if (!args || typeof args !== "object") return {};
  return Object.fromEntries(Object.entries(args).filter(([, value]) => value !== undefined));
}
async function callTool(name, args) {
  const toolArgs = sanitizeToolArguments(args);
  const response = await fetch(`/api/tools/${encodeURIComponent(name)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(toolArgs),
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result?.message || result?.error || `HTTP ${response.status}`);
  return result;
}
function sleep(ms) { return new Promise((resolve) => window.setTimeout(resolve, ms)); }
function isRetryableToolError(error) {
  const message = String(error?.message || error || "").toLowerCase();
  return /(timeout|timed out|network|temporar|429|503|fetch_failed|stock_candlesticks)/.test(message);
}
async function callMarketTool(name, args, attempts = 2) {
  let lastError = null;
  for (let attempt = 0; attempt < attempts; attempt += 1) {
    try {
      const result = await callTool(name, args);
      const structured = result?.structuredContent || result || {};
      if (result?.isError || structured.ok === false) {
        throw new Error(structured.message || structured.error || `${name} failed`);
      }
      return result;
    } catch (error) {
      lastError = error;
      if (attempt + 1 >= attempts || !isRetryableToolError(error)) break;
      await sleep(420 * (attempt + 1));
    }

      if (currentSymbol === symbol) {

      }

    if (currentSymbol === symbol && securityWorkspaceRequestTokens.get(tabId) === requestId) {

}

function comparisonRowsForTime(rows, time, indexState) {
  while (indexState.index + 1 < rows.length && Number(rows[indexState.index + 1]?.time) <= time) indexState.index += 1;
  return Number(rows[indexState.index]?.time) <= time ? rows[indexState.index] : null;
}
function comparisonPairs(rows) {
  const cursor = { index: 0 };
  const pairs = [];
  for (const candle of currentCandles) {
    const comparable = comparisonRowsForTime(rows, Number(candle.time), cursor);
    const primaryClose = Number(candle.close);
    const compareClose = Number(comparable?.close);
    if (Number.isFinite(primaryClose) && primaryClose > 0 && Number.isFinite(compareClose) && compareClose > 0) {
      pairs.push({ time: Number(candle.time), primary: primaryClose, compare: compareClose });
    }
  }
  return pairs;
}
function pearsonCorrelation(left, right) {
  if (left.length < 2 || left.length !== right.length) return null;
  const leftMean = left.reduce((sum, value) => sum + value, 0) / left.length;
  const rightMean = right.reduce((sum, value) => sum + value, 0) / right.length;
  let numerator = 0, leftSquares = 0, rightSquares = 0;
  for (let index = 0; index < left.length; index += 1) {
    const a = left[index] - leftMean, b = right[index] - rightMean;
    numerator += a * b;
    leftSquares += a * a;
    rightSquares += b * b;
  }
  const denominator = Math.sqrt(leftSquares * rightSquares);
  return denominator > 0 ? numerator / denominator : null;
}
function comparisonMetrics(rows) {
  const pairs = comparisonPairs(rows);
  if (pairs.length < 2) return null;
  const first = pairs[0], last = pairs[pairs.length - 1];
  const primaryReturn = (last.primary / first.primary - 1) * 100;
  const compareReturn = (last.compare / first.compare - 1) * 100;
  const primaryDaily = [], compareDaily = [];
  for (let index = 1; index < pairs.length; index += 1) {
    primaryDaily.push(pairs[index].primary / pairs[index - 1].primary - 1);
    compareDaily.push(pairs[index].compare / pairs[index - 1].compare - 1);
  }
  return {
    pairs,
    primaryReturn,
    compareReturn,
    excessReturn: primaryReturn - compareReturn,
    relativeStrength: ((1 + primaryReturn / 100) / (1 + compareReturn / 100) - 1) * 100,
    correlation: pearsonCorrelation(primaryDaily, compareDaily),
    lastPrice: last.compare,
  };
}
function signedPercent(value) {
  return Number.isFinite(value) ? `${value >= 0 ? "+" : ""}${value.toFixed(2)}%` : "--";
}
function drawComparisonLayer() {
  const layer = document.getElementById("comparisonLayer");
  const panel = document.getElementById("comparisonPerformance");

  const title = document.getElementById("comparisonPerformanceTitle");

  if (layer) layer.innerHTML = "";
  if (!panel || !chart || !title || !legend) return;
  if (currentCandles.length < 2 || !comparisonSeries.length) { panel.hidden = true; legend.innerHTML = ""; chart.innerHTML = ""; return; }
  const valid = comparisonSeries.map((series, index) => {
    const rows = Array.isArray(series.rows) ? series.rows.filter((row) => Number.isFinite(Number(row?.time)) && Number.isFinite(Number(row?.close))) : [];
    const metrics = comparisonMetrics(rows);
    return metrics ? { series, metrics, color: COMPARISON_COLORS[index % COMPARISON_COLORS.length] } : null;
  }).filter(Boolean);
  if (!valid.length) { panel.hidden = true; return; }

  const reference = valid[0].metrics.pairs;
  const primary = reference.map((pair) => ({ time: pair.time, value: pair.primary }));
  const lines = [{ name: currentName || currentSymbol || "主标的", color: "#00a86b", dash: "", values: primary, primary: true }];
  valid.forEach(({ series, metrics, color }) => lines.push({ name: series.name || series.symbol, color, dash: "5 3", values: metrics.pairs.map((pair) => ({ time: pair.time, value: pair.compare })), primary: false }));
  const pointsForMode = lines.map((line) => {
    const base = Number(line.values[0]?.value);
    if (!Number.isFinite(base) || base === 0) return { ...line, values: [] };
    if (comparisonMode === "return") return { ...line, values: line.values.map((point) => ({ time: point.time, value: (point.value / base - 1) * 100 })) };
    const min = Math.min(...line.values.map((point) => point.value));
    const max = Math.max(...line.values.map((point) => point.value));
    const span = max - min || Math.max(Math.abs(max) * 0.02, 1);
    return { ...line, values: line.values.map((point) => ({ time: point.time, value: (point.value - min) / span * 100 })) };
  }).filter((line) => line.values.length >= 2);
  if (!pointsForMode.length) { panel.hidden = true; return; }

  const all = pointsForMode.flatMap((line) => line.values);
  const minTime = Math.min(...all.map((point) => point.time));
  const maxTime = Math.max(...all.map((point) => point.time));
  const rawValues = all.map((point) => point.value);
  const rawMin = comparisonMode === "return" ? Math.min(0, ...rawValues) : Math.min(...rawValues);
  const rawMax = comparisonMode === "return" ? Math.max(0, ...rawValues) : Math.max(...rawValues);
  const span = rawMax - rawMin || 1;

  const labels = comparisonMode === "return" ? `<text class="comparison-performance-value" x="5" y="13">${rawMax.toFixed(1)}%</text><text class="comparison-performance-value" x="5" y="${height - 5}">${rawMin.toFixed(1)}%</text>` : "";
  chart.setAttribute("viewBox", `0 0 ${width} ${height}`);

  title.textContent = comparisonMode === "return" ? t("comparisonPerformance") : t("compareAbsolute");
  if (subtitle) subtitle.textContent = comparisonMode === "return" ? t("comparisonPerformanceHint") : t("comparisonAbsoluteHint");
  legend.innerHTML = pointsForMode.map((line) => {

    const x = position(candle);

function registerMaGroupIndicator(periods) {
  const normalized = periods.map((period) => Number(period)).filter((period) => Number.isInteger(period) && period >= 2 && period <= 200).slice(0, 6);
  if (!window.klinecharts || !normalized.length) return null;
  const name = `ftvMAG${normalized.join("_")}`;
  if (registeredMaGroupIndicators.has(name)) return name;
  const figures = normalized.map((period, index) => ({
    key: `ma${index}`,
    title: `MA${period}: `,
    type: "line",
    attrs: (params) => {
      const cur = params?.coordinate?.current;
      const next = params?.coordinate?.next;
      if (!cur || cur.value === undefined || !next || next.value === undefined) return null;
      return { coordinates: [{ x: cur.x, y: cur.value }, { x: next.x, y: next.value }] };
    },
    styles: () => ({ color: chartColors().ma[index % chartColors().ma.length], size: 1.5 }),
  }));
  window.klinecharts.registerIndicator({
    name,
    shortName: "MA",
    series: "price",
    precision: 2,
    calc: (dataList, indicator) => {
      const maps = indicator?.extendData?.maps || {};
      const mapNames = indicator?.extendData?.mapNames || [];
      return (dataList || []).map((row) => {
        const result = {};
        normalized.forEach((period, index) => {
          const map = maps[mapNames[index]] || maps[`ma${period}`] || {};
          const value = map[row.timestamp];
          result[`ma${index}`] = Number.isFinite(value) ? value : undefined;
        });
        return result;
      });
    },
    figures,
  });
  registeredMaGroupIndicators.add(name);
  return name;
}

function isSupportResistanceLevel(cmd) {
  const from = Number(cmd?.from?.price);
  const to = Number(cmd?.to?.price);
  if (!Number.isFinite(from) || !Number.isFinite(to) || Math.abs(from - to) > 1e-8) return false;
  const text = `${cmd?.id || ""} ${cmd?.label || ""}`;
  return /(support|resistance|level|支撑|压力|价位)/i.test(text);
}
function levelLineText(cmd, price) {
  const label = String(cmd?.label || "").trim();
  const value = fmt(Number(price), 2);
  return label.includes(value) ? label : `${label || t("level")} ${value}`;
}

async function applyChartCommands(payload) {
  if (!kchart) return;
  lastChartPayload = payload;
  clearOverlays();
  clearBackendIndicators();
  activeMaMaps = [];
  activeVwapMap = null;
  const maLayer = document.getElementById("maLayer");
  const maLegend = document.getElementById("maLegend");
  if (maLayer) maLayer.innerHTML = "";
  if (maLegend) maLegend.innerHTML = "";

  const cmds = payload.chartCommands || [];
  // First pass: candles
  for (const cmd of cmds) {
    if (cmd.type === "SET_CANDLES" && Array.isArray(cmd.rows)) {
      currentCandles = cmd.rows;
      const kd = toKlineData(cmd.rows);
      if (kd.length) kchart.applyNewData(kd);
    }
  }
  // Short ranges are a continuous intraday view. Reapply after the new first
  // and last prices are available so the area color follows the session move.
  refreshChartTheme();
  // A chart session can include benchmark rows for an immediate first paint.
  const directComparison = cmds.find((cmd) => cmd.type === "SET_COMPARISON_SERIES" && Array.isArray(cmd.series));
  if (directComparison) {
    comparisonSeries = directComparison.series
      .filter((item) => item && item.symbol && Array.isArray(item.rows) && item.rows.length >= 2)
      .slice(0, MAX_COMPARISONS)
      .map((item) => ({ symbol: String(item.symbol), name: String(item.name || item.symbol), rows: item.rows }));
    comparisonRestores = [];
    renderComparisons();
  }
  // Indicators + marks + range
  const renderedLevelPrices = new Set();
  for (const cmd of cmds) {
    if (cmd.type === "SET_RANGE" && (!payload.local_render || payload.fit_to_data)) {
      try { kchart.setOffsetRightSpace(72); kchart.scrollToTimestamp(Number(cmd.end) * 1000); } catch {}
    } else if (cmd.type === "SET_INDICATOR_SERIES") {
      applyIndicatorSeries(cmd);
    } else if (cmd.type === "DRAW_TREND_LINE") {
      const s = nearestCandle(Number(cmd.from?.time));
      const e = nearestCandle(Number(cmd.to?.time));
      if (s && e) {
        try {
          const fromPrice = Number(cmd.from?.price || s.close);
          const toPrice = Number(cmd.to?.price || e.close);
          // Horizontal support/resistance is a price annotation, not a trend line.
          // Keep the exact level next to its candle and avoid chart-wide stripes.
          if (isSupportResistanceLevel(cmd)) {
            renderedLevelPrices.add(toPrice.toFixed(6));
            kchart.createOverlay({
              name: "ftvTextMarker",
              id: `level:${cmd.id || `${s.time}:${e.time}`}`,
              groupId: "analysis",
              paneId: "candle_pane",
              extendData: { text: levelLineText(cmd, toPrice), colorName: cmd.color || "info" },
              onClick: () => {
                publishSelection(markerSelection(cmd));
                drawSelectionHighlight(e);
                return true;
              },
              points: [{ timestamp: e.time * 1000, value: toPrice }],
            });
            continue;
          }
          kchart.createOverlay({
            name: "ftvTrendLine",
            id: cmd.id || undefined,
            groupId: "analysis",
            paneId: "candle_pane",
            extendData: { label: cmd.label || "", colorName: cmd.color || "danger" },
            onClick: () => {
              publishSelection(markerSelection(cmd));
              drawSelectionHighlight(nearestCandle(Number(cmd.from?.time)));
              return true;
            },
            points: [
              { timestamp: s.time * 1000, value: fromPrice },
              { timestamp: e.time * 1000, value: toPrice },
            ],
          });
        } catch {}
      }
    } else if (cmd.type === "TEXT_MARKER") {
      const c = nearestCandle(Number(cmd.time));
      if (c) {
        try {
          if (renderedLevelPrices.has(Number(cmd.price || c.high).toFixed(6))) continue;
          kchart.createOverlay({
            name: "ftvTextMarker",
            id: cmd.id || undefined,
            groupId: "analysis",
            paneId: "candle_pane",
            extendData: { text: cmd.text || "标注", colorName: cmd.color || "info" },
            onClick: () => {
              publishSelection(markerSelection(cmd));
              drawSelectionHighlight(c);
              return true;
            },
            points: [{ timestamp: c.time * 1000, value: Number(cmd.price || c.high) }],
          });
        } catch {}
      }
    }
  }
  recalcChartHeight();
  applyPaneLayouts();
  drawPriceAlertOverlays();
  renderPriceAlerts();
  renderComparisonSummary();
  drawComparisonLayer();
  renderUserDrawings();
  if (currentSelection?.kind === "range") drawRangeHighlight();
  else if (currentSelection?.candle) drawSelectionHighlight(nearestCandle(currentSelection.candle.time));
  if (!payload.local_render || payload.fit_to_data) {
    window.requestAnimationFrame(fitChartToData);
  } else {
    scheduleChartOverlayRender();
  }
}

function renderHeader(name, symbol, rows) {
  document.getElementById("name").textContent = name || symbol || "dsh_kline";
  document.getElementById("symbolChip").textContent = symbol || "—";
  if (!rows || !rows.length) return;
  const last = rows[rows.length - 1], prev = rows[rows.length - 2];
  const close = document.getElementById("qClose");
  close.textContent = fmt(Number(last.close), 2);
  if (prev) {
    const delta = Number(last.close) - Number(prev.close);
    const chg = (Number(last.close) / Number(prev.close) - 1) * 100;
    const el = document.getElementById("qChange");
    const direction = chg >= 0 ? "up" : "down";
    close.className = "close " + direction;
    el.textContent = (delta >= 0 ? "+" : "") + delta.toFixed(2) + "  " + (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%";
    el.className = "change " + (chg >= 0 ? "up" : "down");

function dataFetchFailureDetail(error) {
  const raw = String(error?.message || error || "").trim();
  if (!raw) return "--";
  const http = raw.match(/HTTP\s+(\d{3})/i);
  if (http) {
    const detail = /系统错误/.test(raw) ? "（上游系统错误）" : "";
    return `FTShare HTTP ${http[1]}${detail}`;
  }
  if (/ftshare_not_installed/i.test(raw)) return "FTShare SDK 未安装";
  if (/(timeout|timed out)/i.test(raw)) return "数据源请求超时";
  if (/(network|connection|resolve)/i.test(raw)) return "无法连接数据源";
  return raw.replace(/^ftshare stock_candlesticks failed:\s*/i, "FTShare：").slice(0, 180);
}

/* ---------- ranges, intervals and watchlist ---------- */
const INDICATOR_HISTORY_BUFFER_DAYS = 180;
function rangeLabel(key = currentRangeKey) {
  if (key === "custom") return t("custom");
  return RANGE_PRESETS[key]?.label || "1Y";
}
function dateInputValue(timestamp) {
  if (!Number.isFinite(Number(timestamp))) return "";
  const date = new Date(Number(timestamp) * 1000);
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${date.getFullYear()}-${month}-${day}`;
}
function dateInputTimestamp(value, endOfDay = false) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ""))) return null;
  const suffix = endOfDay ? "T23:59:59" : "T00:00:00";
  const stamp = new Date(`${value}${suffix}`).getTime();
  return Number.isFinite(stamp) ? Math.floor(stamp / 1000) : null;
}
function rangeDisplayLimit(key = currentRangeKey) {
  if (key === "1d") return 250;
  if (key === "5d") return 260;
  if (key === "ytd") {
    const now = new Date();
    return Math.min(4000, Math.ceil((now - new Date(now.getFullYear(), 0, 1)) / 86400000) + 18);
  }
  if (key === "custom") {
    const start = dateInputTimestamp(customRangeStart);
    const end = dateInputTimestamp(customRangeEnd, true);
    if (Number.isFinite(start) && Number.isFinite(end) && end >= start) {
      return Math.min(4000, Math.ceil((end - start) / 86400) + 2);
    }
  }
  return RANGE_PRESETS[key]?.limit || 390;
}
function rangeFetchLimit(key = currentRangeKey) {
  if (isIntradayRange(key)) return rangeDisplayLimit(key);
  // Fetch enough prior bars for MA/BOLL/RSI warm-up. cropRowsForRange keeps
  // the display and user-selected analysis window independent from this context.
  return Math.min(4000, rangeDisplayLimit(key) + INDICATOR_HISTORY_BUFFER_DAYS);
}
function isIntradayRange(key = currentRangeKey) { return key === "1d" || key === "5d"; }
function isFtshareIntradayUnsupportedSymbol(symbol = currentSymbol) {
  const normalized = String(symbol || "").trim().toUpperCase();
  return normalized.endsWith((".US", ".NASDAQ", ".NYSE", ".HK", ".HKG"))
    || normalized.startsWith("100.NDX") || normalized.startsWith("100.HSI");
}
function isFtshareIntradayUnavailable(symbol = currentSymbol, rangeKey = currentRangeKey) {
  return isIntradayRange(rangeKey) && isFtshareIntradayUnsupportedSymbol(symbol);
}
function isIntradayPresentation() { return sourceCandleInterval === "minute" && isIntradayRange(); }
function intradayIntervalValue(key = currentRangeKey) { return key === "1d" ? 1 : 5; }
function intradaySessionCount(key = currentRangeKey) { return key === "1d" ? 1 : 5; }
function candleFetchArgs(symbol, { rangeKey = currentRangeKey, fullHistory = false } = {}) {
  const intraday = isIntradayRange(rangeKey);
  const request = {
    symbol: String(symbol || "").trim(),
    // Retain daily source bars for every non-intraday view. The app aggregates
    // them locally for week/month/quarter/year, which makes period switches
    // immediate and keeps all indicators on one aligned source series.
    interval: intraday ? "minute" : "day",
    interval_value: intraday ? intradayIntervalValue(rangeKey) : 1,
    limit: intraday ? rangeFetchLimit(rangeKey) : (fullHistory ? PREFETCH_DAILY_LIMIT : rangeFetchLimit(rangeKey)),
    adjust: "none",
  };
  if (intraday) request.session_count = intradaySessionCount(rangeKey);
  return request;
}
function candleRequestMatches(candidate, request) {
  return String(candidate?.symbol || "").toUpperCase() === String(request?.symbol || "").toUpperCase()
    && String(candidate?.interval || "").toLowerCase() === String(request?.interval || "").toLowerCase()
    && Number(candidate?.interval_value || 1) === Number(request?.interval_value || 1)
    && Number(candidate?.session_count || 0) === Number(request?.session_count || 0)
    && String(candidate?.adjust || "none").toLowerCase() === String(request?.adjust || "none").toLowerCase()
    && Number(candidate?.limit || 0) >= Number(request?.limit || 0);
}
function freshPrefetchedCandle(request) {
  const now = Date.now();
  let best = null;
  for (const [key, entry] of prefetchedCandles) {
    if (now - Number(entry?.at || 0) > PREFETCH_CANDLE_TTL_MS) {
      prefetchedCandles.delete(key);
      continue;
    }
    if (candleRequestMatches(entry?.request, request) && (!best || Number(entry.request.limit) < Number(best.request.limit))) best = entry;
  }
  return best?.payload || null;
}
function pendingCandlePrefetch(request) {
  let best = null;
  for (const entry of candlePrefetchTasks.values()) {
    if (candleRequestMatches(entry?.request, request) && (!best || Number(entry.request.limit) < Number(best.request.limit))) best = entry;
  }
  return best?.promise || null;
}
function candlePrefetchKey(request) {
  return [request.symbol, request.interval, request.interval_value || 1, request.session_count || 0, request.limit, request.adjust || "none"]
    .map((value) => String(value).toUpperCase()).join("|");
}
async function prefetchCandleData(request) {
  if (!request?.symbol || freshPrefetchedCandle(request)) return freshPrefetchedCandle(request);
  const existing = pendingCandlePrefetch(request);
  if (existing) return existing;
  const key = candlePrefetchKey(request);
  const entry = { request, promise: null };
  entry.promise = callMarketTool("fetch_candles", request, 1)
    .then((result) => {
      const payload = result?.structuredContent || result || {};
      if (!result?.isError && payload.ok && Array.isArray(payload.rows) && payload.rows.length >= 2) {
        prefetchedCandles.set(key, { at: Date.now(), request, payload });
        return payload;
      }
      return null;
    })
    .catch((error) => {
      console.info("candle prefetch deferred", { symbol: request.symbol, error: String(error?.message || error) });
      return null;
    })
    .finally(() => candlePrefetchTasks.delete(key));
  candlePrefetchTasks.set(key, entry);
  return entry.promise;
}
function freshPrefetchedWorkspace(symbol) {
  const key = String(symbol || "").trim().toUpperCase();
  const entry = prefetchedWorkspaces.get(key);
  if (!entry) return null;
  if (Date.now() - Number(entry.at || 0) > PREFETCH_WORKSPACE_TTL_MS) {
    prefetchedWorkspaces.delete(key);
    return null;
  }
  return entry.workspace || null;
}
async function prefetchSecurityWorkspace(symbol, name) {
  const key = String(symbol || "").trim().toUpperCase();
  if (!key || freshPrefetchedWorkspace(key)) return freshPrefetchedWorkspace(key);
  const existing = workspacePrefetchTasks.get(key);
  if (existing) return existing;
  const promise = callMarketTool("fetch_security_workspace", { symbol, name }, 1)
    .then((result) => {
      const payload = result?.structuredContent || result || {};
      const workspace = !result?.isError && payload.ok ? payload.security_workspace : null;
      if (workspace) prefetchedWorkspaces.set(key, { at: Date.now(), workspace });
      return workspace;
    })
    .catch((error) => {
      console.info("security workspace prefetch deferred", { symbol, error: String(error?.message || error) });
      return null;
    })
    .finally(() => workspacePrefetchTasks.delete(key));
  workspacePrefetchTasks.set(key, promise);
  return promise;
}
async function prefetchSymbolData(item) {
  const symbol = String(item?.symbol || "").trim();
  if (!symbol) return;
  const name = String(item?.name || symbol);
  // Prioritize the source shared by every daily chart and the info tabs.
  await Promise.all([
    prefetchCandleData(candleFetchArgs(symbol, { rangeKey: "5y", fullHistory: true })),
    prefetchSecurityWorkspace(symbol, name),
  ]);
  // Intraday data has a different source contract. FTShare has no usable
  // U.S./Hong Kong minute bars, so avoid silent prefetch failures for them.
  if (isFtshareIntradayUnsupportedSymbol(symbol)) return;
  // It is small, but loaded second so a default chart can appear quickly.
  await Promise.all([
    prefetchCandleData(candleFetchArgs(symbol, { rangeKey: "1d" })),
    prefetchCandleData(candleFetchArgs(symbol, { rangeKey: "5d" })),
  ]);
}
function normalizedSearchText(value) {
  return String(value || "").trim().toLocaleLowerCase().replace(/\s+/g, "");
}
function scheduleSymbolPrefetch(results, query) {
  const items = Array.isArray(results) ? results.filter((item) => item?.symbol) : [];
  const needle = normalizedSearchText(query);
  if (!needle || Array.from(needle).length < 2 || !items.length) return;
  const item = items.find((candidate) => [candidate.symbol, candidate.name]
    .some((value) => normalizedSearchText(value) === needle)) || items[0];
  window.setTimeout(() => prefetchSymbolData(item).catch((error) => console.info("symbol prefetch deferred", error)), 0);
}
function scheduleCommonIndexPrefetch() {
  if (commonIndexPrefetchScheduled) return;
  commonIndexPrefetchScheduled = true;

    for (const item of PREFETCH_COMMON_INDEXES) {

function cropRowsForRange(rows) {
  const source = Array.isArray(rows) ? rows.slice() : [];
  if (!source.length) return source;
  if (sourceCandleInterval === "minute" && isIntradayRange()) return source;
  if (["5d", "10d", "30d"].includes(currentRangeKey) && currentInterval === "day") {
    return source.slice(-Number(currentRangeKey.replace("d", "")));
  }
  const last = Number(source[source.length - 1]?.time);
  if (!Number.isFinite(last)) return source;
  let start = null;
  let end = null;
  if (currentRangeKey === "ytd") {
    const year = new Date(last * 1000).getFullYear();
    start = Math.floor(new Date(year, 0, 1).getTime() / 1000);
  } else if (currentRangeKey === "custom") {
    start = dateInputTimestamp(customRangeStart);
    end = dateInputTimestamp(customRangeEnd, true);
  } else {
    const days = RANGE_PRESETS[currentRangeKey]?.days;
    if (Number.isFinite(days)) start = last - Number(days) * 86400;
  }
  const filtered = source.filter((row) => Number(row.time) >= (start ?? -Infinity) && Number(row.time) <= (end ?? Infinity));
  return filtered.length >= 2 ? filtered : source;
}
function aggregateRowsForInterval(rows, interval) {
  const source = Array.isArray(rows) ? rows : [];
  if (interval === "day" || !source.length) return source.slice();
  const buckets = new Map();
  for (const row of source) {
    const parts = new Intl.DateTimeFormat("en-CA", { timeZone: exchangeTimezone, year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" }).formatToParts(new Date(Number(row.time) * 1000));
    const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
    const year = Number(values.year), month = Number(values.month), day = Number(values.day);
    if (![year, month, day].every(Number.isFinite)) continue;
    const localDate = new Date(Date.UTC(year, month - 1, day));
    const dayOffset = (localDate.getUTCDay() + 6) % 7;
    localDate.setUTCDate(localDate.getUTCDate() - dayOffset);
    const week = `${localDate.getUTCFullYear()}-${String(localDate.getUTCMonth() + 1).padStart(2, "0")}-${String(localDate.getUTCDate()).padStart(2, "0")}`;
    const key = interval === "week" ? week
      : interval === "month" ? `${year}-${String(month).padStart(2, "0")}`
      : interval === "quarter" ? `${year}-Q${Math.floor((month - 1) / 3) + 1}`
      : String(year);
    const existing = buckets.get(key);
    if (!existing) {
      buckets.set(key, { ...row, open: Number(row.open), high: Number(row.high), low: Number(row.low), close: Number(row.close), volume: Number(row.volume || 0) });
      continue;
    }
    existing.high = Math.max(Number(existing.high), Number(row.high));
    existing.low = Math.min(Number(existing.low), Number(row.low));
    existing.close = Number(row.close);
    existing.time = Number(row.time);
    existing.volume += Number(row.volume || 0);
  }

function cacheSymbolSearch(query, results) {
  const key = String(query || "").trim().toLocaleLowerCase();
  if (!key || !Array.isArray(results)) return;
  symbolSearchCache.set(key, { at: Date.now(), results: results.slice(0, 12) });
  while (symbolSearchCache.size > SYMBOL_SEARCH_CACHE_MAX_ENTRIES) {
    symbolSearchCache.delete(symbolSearchCache.keys().next().value);
  }
}
function cachedSymbolSearch(query) {
  const key = String(query || "").trim().toLocaleLowerCase();
  if (!key) return [];
  const now = Date.now();
  let matches = [];
  for (const [cachedQuery, entry] of symbolSearchCache) {
    if (now - entry.at > SYMBOL_SEARCH_CACHE_TTL_MS) {
      symbolSearchCache.delete(cachedQuery);
      continue;
    }
    if (key.startsWith(cachedQuery) || cachedQuery.startsWith(key)) {
      matches = matches.concat(entry.results.filter((item) => searchResultMatches(item, key)));
    }
  }
  const localItems = [
    currentSymbol ? { symbol: currentSymbol, name: currentName || currentSymbol } : null,
    ...watchlist,
    ...workspaceTabs.map((tab) => ({ symbol: tab.symbol, name: tab.name })),
    ...marketTickerItems,
  ].filter(Boolean).filter((item) => searchResultMatches(item, key));
  const directoryMatches = symbolDirectory
    .filter((item) => searchResultMatches(item, key))
    .sort((left, right) => {
      const leftText = `${left.symbol} ${left.name}`.toLocaleLowerCase();
      const rightText = `${right.symbol} ${right.name}`.toLocaleLowerCase();
      return Number(!leftText.startsWith(key)) - Number(!rightText.startsWith(key));
    })
    .slice(0, 12);
  const seen = new Set();
  return matches.concat(localItems, directoryMatches).filter((item) => {
    const symbol = String(item?.symbol || "");
    if (!symbol || seen.has(symbol)) return false;
    seen.add(symbol);
    return true;
  }).slice(0, 12);
}

  }
  const requestId = ++symbolOpenRequestId;
  const previousSymbol = String(currentSymbol || "").trim().toUpperCase();
  openingSymbol = true;
  closeSearchResults();
  setChartStatus(t("loading"));
  if (options.showLoading !== false) {
    showChartLoading(t("fetchingData"));
    showActivityNotice(t("fetchingData"));
  }
  try {
    const intraday = isIntradayRange();
    const candleRequest = candleFetchArgs(symbol);
    let fetched = freshPrefetchedCandle(candleRequest);
    if (!fetched) {
      const pending = pendingCandlePrefetch(candleRequest);
      if (pending) await pending;
      fetched = freshPrefetchedCandle(candleRequest);
    }
    const fetchedResult = fetched
      ? { structuredContent: fetched }
      : await callMarketTool("fetch_candles", candleRequest);
    fetched = fetchedResult?.structuredContent || fetchedResult || {};
    if (fetchedResult?.isError || !fetched.ok || !Array.isArray(fetched.rows)) {
      throw new Error(fetched.message || fetched.error || "fetch failed");
    }
    if (requestId !== symbolOpenRequestId) return;
    sourceCandles = fetched.rows.slice();
    sourceCandleInterval = String(fetched.interval || (intraday ? "minute" : currentInterval) || "day");
    localChartDataMeta = {
      source: fetched.source || "ftshare",
      source_url: fetched.source_url || fetched.sourceUrl || "",
      updated_at: fetched.updated_at || Math.floor(Date.now() / 1000),
      status: fetched.status || "delayed",
      market_status: fetched.market_status || "",
      exchange_timezone: fetched.exchange_timezone || "Asia/Shanghai",
    };
    currentSymbol = fetched.symbol || symbol;
    currentName = fetched.name || name || symbol;
    applyMarketPalette(currentSymbol);
    const nextSymbol = String(currentSymbol || "").trim().toUpperCase();
    if (!previousSymbol || previousSymbol !== nextSymbol) {
      lastMarks = [];
      lastLines = [];
    }
    await renderCurrentViewLocally({ fitToData: true });
    clearDataFetchError();
    if (requestId === symbolOpenRequestId && options.showLoading !== false) {
      finishChartLoading(t("dataReady"));
      finishActivityNotice(t("dataReady"));
    }
    scheduleLocalIndicatorWarmup();
    // The data workspace is intentionally non-blocking: K lines should be
    // visible even when a news or fundamental endpoint is slow or unavailable.
    loadSecurityWorkspace(currentSymbol, currentName).catch(console.warn);
    return true;
  } catch (error) {
    if (requestId !== symbolOpenRequestId) return;
    const preserve = Boolean(options.preserveOnFailure) && currentSymbol === symbol && currentCandles.length;
    const request = { symbol, name: name || currentName || symbol, rangeKey: currentRangeKey, interval: currentInterval };
    showDataFetchError(error, request);
    if (preserve) {
      updateChartDataState({}, true);
      scheduleChartDataRetry();
      setChartStatus(t("retrying"));
    }
    if (options.showLoading !== false) {
      const detail = dataFetchFailureDetail(error);
      finishChartLoading(`${t("dataFailed")}：${detail}`, true);
      finishActivityNotice(`${t("dataFailed")}：${detail}`, true);
    }
    return false;
  } finally {
    if (requestId === symbolOpenRequestId) {
      openingSymbol = false;
      setChartStatus("");
    }
  }
}

/* ---------- main tool-result handler ---------- */
async function handleToolResult(result) {
  const structured = result?.structuredContent || result || {};
  if (result?.isError || structured.error) {
    showError(structured.message || structured.error || "tool error");
    setChartStatus("失败");
    return;
  }
  showError("");

  // A data provider may send this independently from a chart payload. The view
  // deliberately consumes only this normalized contract, never provider fields.
  const workspace = structured.security_workspace || structured.securityWorkspace;
  if (workspace && typeof workspace === "object") {
    securityWorkspaceData = workspace;
    securityWorkspaceLoading = false;
    const workspaceTab = workspaceTabForSymbol(workspace.symbol || currentSymbol);
    if (workspaceTab) {
      workspaceTab.workspace = workspace;
      workspaceTab.workspaceLoading = false;
    }
    renderSecurityWorkspace();
    if (!Array.isArray(structured.chartCommands)) {
      reportSize();
      return;
    }
  }

  // draw_kline payload
  if (Array.isArray(structured.chartCommands)) {
    if (!structured.local_render) {
      const sourceCommand = structured.chartCommands.find((command) => command.type === "SET_CANDLES" && Array.isArray(command.rows));
      if (sourceCommand?.rows?.length) sourceCandles = sourceCommand.rows.slice();
      sourceCandleInterval = String(structured.interval || sourceCandleInterval || "day");
      localChartDataMeta = structured.data_meta || structured.dataMeta || localChartDataMeta;
    }
    currentSymbol = structured.symbol || currentSymbol;
    currentName = structured.name || currentName || currentSymbol;
    applyMarketPalette(currentSymbol);
    currentInterval = structured.interval || currentInterval;
    currentRangeKey = structured.range_key || currentRangeKey;
    updateChartDataState(structured.data_meta || structured.dataMeta || { source: "mcp", updated_at: Math.floor(Date.now() / 1000) });
    syncTimeControls();
    // Sync toggle state from returned indicators if present
    if (Array.isArray(structured.indicators)) {
      const set = new Set(structured.indicators.map(String));
      maVisible = set.has("ma");
      vwapVisible = set.has("vwap");
      volVisible = set.has("vol");
      macdVisible = set.has("macd");
      kdjVisible = set.has("kdj");
      bollVisible = set.has("boll");
      rsiVisible = set.has("rsi");
      atrVisible = set.has("atr");
      syncIndicatorConfigFromCommands(structured.chartCommands);
      syncToggleButtons();
      if (!structured.local_render) primeLocalIndicatorCache();
    }
    // Extract rows from SET_CANDLES for header
    let rows = currentCandles;
    for (const cmd of structured.chartCommands) {
      if (cmd.type === "SET_CANDLES" && Array.isArray(cmd.rows)) rows = cmd.rows;
    }
    rememberWorkspaceTab(structured);
    renderHeader(currentName, currentSymbol, rows);
    syncWatchlistButton();
    renderWatchlist();
    saveWorkspacePreferences();
    await applyChartCommands(structured);
    // A host can send draw_kline without the optional security_workspace
    // payload. Start that non-blocking request here as well as after search so
    // News and Company do not remain blank just because this was the first
    // chart opened in a new local session.
    if (!structured.local_render && currentSymbol && !securityWorkspaceData && !securityWorkspaceLoading) {
      loadSecurityWorkspace(currentSymbol, currentName).catch(console.warn);
    }
    // A persisted 1D/5D selection requires minute candles. The first host
    // draw_kline payload is often a daily warm-up series, so replace it before
    // rendering rather than leaving a disabled day chart under an intraday tab.
    if (!structured.local_render && isIntradayRange() && sourceCandleInterval !== "minute" && currentSymbol && !openingSymbol) {
      applyIntradayPresentationDefaults();
      await openSymbol(currentSymbol, currentName);
      return;
    }
    // draw_kline intentionally accepts a wider OHLCV context so longer
    // indicators have valid warm-up data. If the host did not explicitly
    // choose a range, honour the user's persisted range immediately instead
    // of leaving a 10D/30D button active while the full source series remains
    // on screen. The nested render is local_render=true, so this is one pass
    // only and never repeats on later tool results.
    if (!structured.local_render && !structured.range_key && sourceCandles.length >= 2) {
      if (!isIntradayRange() && sourceCandleInterval === "day" && !hasLocalRowsForRange(currentRangeKey) && currentSymbol && !openingSymbol) {
        await openSymbol(currentSymbol, currentName, { preserveOnFailure: true });
        return;
      }
      await renderCurrentViewLocally({ fitToData: true });
      return;
    }
    restoreComparisons();
    refreshPercentAxis();
    setChartStatus("");
    reportSize();
    return;
  }

  // calc_range payload → cards + table
  if (structured.return_pct !== undefined && structured.bars !== undefined) {
    renderCards([
      { id: "return", title: "区间涨跌", value: structured.return_pct, unit: "%" },
      { id: "amp", title: "振幅", value: structured.amplitude_pct, unit: "%" },
      { id: "dd", title: "最大回撤", value: structured.max_drawdown?.max_drawdown_pct, unit: "%" },
      { id: "bars", title: "K线数", value: structured.bars, unit: "" },
      { id: "days", title: "日历天", value: structured.duration_days, unit: "天" },
      { id: "up", title: "阳/阴", value: `${structured.up_bars}/${structured.down_bars}`, unit: "" },
    ]);
    renderTables([{
      title: "区间明细",
      headers: ["字段", "值"],
      rows: [
        ["起点", fmtDate(structured.start_time)],
        ["终点", fmtDate(structured.end_time)],
        ["开/收", `${structured.open} / ${structured.close}`],
        ["高/低", `${structured.high} / ${structured.low}`],
        ["连涨/连跌", `${structured.max_up_streak} / ${structured.max_down_streak}`],
        ["均量", structured.avg_volume],
      ],
    }]);
    revealAnalysisResults();
    setChartStatus("");
    reportSize();
    return;
  }

  // calc_metrics: show compact cards for known keys
  if (Array.isArray(structured.metrics_computed)) {
    const cards = [];
    if (structured.max_drawdown) {
      cards.push({ id: "dd", title: "最大回撤", value: structured.max_drawdown.max_drawdown_pct, unit: "%" });
    }
    if (structured.rsi?.last) {
      cards.push({ id: "rsi", title: "RSI", value: structured.rsi.last.value, unit: "" });
    }
    if (structured.atr?.last) {
      cards.push({ id: "atr", title: "ATR%", value: structured.atr.atr_pct, unit: "%" });
    }
    if (structured.ma_cross) {
      cards.push({ id: "cross", title: "交叉次数", value: (structured.ma_cross.crosses || []).length, unit: "" });
    }
    renderCards(cards);
    revealAnalysisResults();
    setChartStatus("");
    reportSize();
  }
}

/* ---------- range selection ---------- */
function setRangeBannerVisible(v) {
  document.getElementById("rangeBanner").style.display = v ? "flex" : "none";
}
function clearSelectionVisuals() {
  if (selectionOverlayId) {
    try { kchart && kchart.removeOverlay({ id: selectionOverlayId }); } catch {}
    selectionOverlayId = null;
  }
  if (rangePickOverlayId) {
    try { kchart && kchart.removeOverlay({ id: rangePickOverlayId }); } catch {}
    rangePickOverlayId = null;
  }
}
function clearRangePick() {
  rangePickStart = null;
  rangePickEnd = null;
  clearSelectionVisuals();
  clearSelectionContext();
  setRangeBannerVisible(false);
}
function drawSelectionHighlight(candle) {
  if (selectionOverlayId) {
    try { kchart && kchart.removeOverlay({ id: selectionOverlayId }); } catch {}
    selectionOverlayId = null;
  }
  if (!kchart || !candle) return;
  try {
    selectionOverlayId = kchart.createOverlay({
      name: "ftvCandleHighlight",
      groupId: "selection",
      paneId: "candle_pane",
      points: [{ timestamp: Number(candle.time) * 1000, value: Number(candle.close) }],
    });
  } catch (e) { console.warn("selection highlight", e); }
}
function drawRangeHighlight() {
  if (rangePickOverlayId) {
    try { kchart.removeOverlay({ id: rangePickOverlayId }); } catch {}
    rangePickOverlayId = null;
  }
  if (!kchart || !rangePickStart || !rangePickEnd) return;
  try {
    rangePickOverlayId = kchart.createOverlay({
      name: "ftvRangeHighlight",
      groupId: "rangePick",
      paneId: "candle_pane",
      points: [
        { timestamp: rangePickStart.time * 1000, value: rangePickStart.close },
        { timestamp: rangePickEnd.time * 1000, value: rangePickEnd.close },
      ],
    });
  } catch (e) { console.warn(e); }
}
function onCandleBarClick(data) {
  if (!currentCandles.length) return;
  const kLineData = data?.data ?? data;
  const ts = Number(kLineData?.timestamp);
  if (!Number.isFinite(ts)) return;
  const candle = nearestCandle(Math.floor(ts / 1000));
  if (!candle) return;
  if (drawingMode) {
    finishDrawing(candle);
    return;
  }
  const point = { time: Number(candle.time), close: Number(candle.close), candle };
  if (!rangePickStart || (rangePickStart && rangePickEnd)) {
    rangePickStart = point;
    rangePickEnd = null;
    clearSelectionVisuals();
    drawSelectionHighlight(candle);
    publishSelection(candleSelection(candle));
    drawRangeHighlight();
    setChartStatus(`起点 ${fmtDate(point.time)}（再点终点）`);
    setTimeout(() => setChartStatus(""), 1500);
  } else {
    if (point.time < rangePickStart.time) {
      rangePickEnd = rangePickStart;
      rangePickStart = point;
    } else if (point.time === rangePickStart.time) {
      return;
    } else {
      rangePickEnd = point;
    }
    clearSelectionVisuals();
    drawRangeHighlight();
    publishSelection(rangeSelection(rangePickStart.candle, rangePickEnd.candle));
  }
}
function selectionAnalysisPrompt(selection) {
  if (!selection) return "请分析当前 K 线图。";
  if (selection.kind === "candle") {
    return `请分析我引用的 ${currentSymbol || "标的"} ${fmtDate(selection.candle.time)} 这根 K 线，结合前后行情和技术指标。`;
  }
  if (selection.kind === "range") {
    return `请分析我引用的 ${currentSymbol || "标的"} ${fmtDate(selection.range.start_time)} 到 ${fmtDate(selection.range.end_time)} 区间，结合涨跌、成交量和技术指标。`;
  }
  return `请分析我引用的分析标记“${selection.marker.text || selection.marker.label || "标记"}”，结合它所在位置前后的行情。`;
}
async function submitSelectionAnalysis() {
  setChartStatus("请回到 dsh 对话继续分析");
}
async function submitRangeAnalyze() {
  if (!rangePickStart || !rangePickEnd || !currentCandles.length) return;
  setChartStatus("区间统计中…");
  try {
    const res = await callTool("calc_range", {
      rows: currentCandles,
      start_time: rangePickStart.time,
      end_time: rangePickEnd.time,
    });
    await handleToolResult(res);
    setChartStatus("");
  } catch (e) {
    showError("区间统计失败：" + String(e));
    setChartStatus("失败");
  }
}

/* ---------- indicator toggle → reapply in the current view ---------- */
async function redrawWithIndicators() {
  // Host-provided local renders may populate currentCandles without retaining
  // a separate sourceCandles buffer. Indicator toggles must still redraw that
  // already-visible chart.
  if ((!sourceCandles.length && !currentCandles.length) || redrawing) return;
  redrawing = true;
  setChartStatus("更新指标…");
  try {
    await renderCurrentViewLocally();
  } catch (e) {
    console.warn("redraw", e);
    showError("重绘失败：" + String(e));
  } finally {
    redrawing = false;
    setChartStatus("");
  }
}
function wireToggle(btnId, getter, setter) {
  const button = document.getElementById(btnId);
  if (!button) return;
  button.onclick = () => {
    const name = btnId.replace(/Btn$/, "");
    setter(!getter());
    saveWorkspacePreferences();
    syncToggleButtons();
    recalcChartHeight();
    redrawWithIndicators().then(() => {
      if (getter()) focusIndicatorPane(name);
    }).catch(console.warn);
  };
}

    document.getElementById("compareMenuBtn")?.setAttribute("aria-expanded", "false");
  }
  if (!target?.closest(".drawing-menu-wrap")) {
    document.getElementById("drawingPopover")?.classList.remove("open");
    document.getElementById("drawingMenuBtn")?.setAttribute("aria-expanded", "false");
  }
  if (!target?.closest("#chartContextMenu")) hideChartContextMenu();
});
document.getElementById("workspaceTabs").addEventListener("click", (event) => {
  const target = event.target instanceof Element ? event.target : null;
  const close = target?.closest("[data-close-tab-id]");
  if (close) {
    closeWorkspaceTab(close.getAttribute("data-close-tab-id")).catch(console.warn);
    return;
  }
  const tab = target?.closest("[data-tab-id]");
  if (tab) selectWorkspaceTab(tab.getAttribute("data-tab-id")).catch(console.warn);
});
document.getElementById("securityNav").addEventListener("click", (event) => {
  const target = event.target instanceof Element ? event.target.closest("[data-security-tab]") : null;
  if (target) setSecurityTab(target.getAttribute("data-security-tab"));
});
document.getElementById("companyWorkspacePanel").addEventListener("click", (event) => {
  const target = event.target instanceof Element ? event.target.closest("[data-company-tab]") : null;
  if (target) setCompanyTab(target.getAttribute("data-company-tab"));
});
wireToggle("maBtn", () => maVisible, (v) => { maVisible = v; });
wireToggle("vwapBtn", () => vwapVisible, (v) => { vwapVisible = v; });
wireToggle("volBtn", () => volVisible, (v) => { volVisible = v; });
wireToggle("macdBtn", () => macdVisible, (v) => { macdVisible = v; });
wireToggle("kdjBtn", () => kdjVisible, (v) => { kdjVisible = v; });
wireToggle("bollBtn", () => bollVisible, (v) => { bollVisible = v; });
document.getElementById("indicatorMenuBtn").addEventListener("click", (event) => {
  event.stopPropagation();
  const popover = document.getElementById("indicatorPopover");
  const open = !popover.classList.contains("open");
  popover.classList.toggle("open", open);
  document.getElementById("indicatorMenuBtn").setAttribute("aria-expanded", String(open));
});
document.getElementById("indicatorPopover").addEventListener("click", (event) => event.stopPropagation());
document.getElementById("applyIndicatorBtn").addEventListener("click", () => {
  const previous = new Set(activeIndicators());
  syncIndicatorConfigFromInputs();
  saveWorkspacePreferences();
  document.getElementById("indicatorPopover").classList.remove("open");
  document.getElementById("indicatorMenuBtn").setAttribute("aria-expanded", "false");
  recalcChartHeight();
  redrawWithIndicators().then(() => {
    const nextPane = activeIndicators().find((name) => !previous.has(name) && indicatorPaneTop(name));
    if (nextPane) focusIndicatorPane(nextPane);
  }).catch(console.warn);
});
document.addEventListener("click", () => {
  document.getElementById("indicatorPopover").classList.remove("open");
  document.getElementById("indicatorMenuBtn").setAttribute("aria-expanded", "false");
});
document.addEventListener("click", (event) => {
  const target = event.target instanceof Element ? event.target : null;
  if (!target?.closest("#symbolSearch")) closeSearchResults();
  if (!target?.closest(".watchlist-wrap")) {
    document.getElementById("watchlistPopover").classList.remove("open");
    document.getElementById("watchlistBtn").setAttribute("aria-expanded", "false");
  }
  if (!target?.closest("#timebar")) document.getElementById("customRangePopover").classList.remove("open");
});
document.getElementById("expandBtn").addEventListener("click", () => {
  toggleExpandedView().catch(console.warn);
});
document.getElementById("rangeAnalyzeBtn").addEventListener("click", () => {
  submitRangeAnalyze().catch(console.warn);
});
document.getElementById("selectionAnalyzeBtn").addEventListener("click", () => {
  submitSelectionAnalysis().catch(console.warn);
});
document.getElementById("rangeClearBtn").addEventListener("click", () => {
  clearRangePick();
  setChartStatus("");
});

/* ---------- standalone lifecycle ---------- */
window.addEventListener("beforeunload", () => {
  viewResizeObserver?.disconnect();
  if (marketTickerRefreshTimer) window.clearInterval(marketTickerRefreshTimer);
  if (chartDataRetryTimer) window.clearTimeout(chartDataRetryTimer);
  if (chartLoadingHideTimer) window.clearTimeout(chartLoadingHideTimer);
  if (watchlistQuoteRefreshTimer) window.clearInterval(watchlistQuoteRefreshTimer);
  try { kchart && kchart.dispose && kchart.dispose(); } catch {}
});

async function init() {
  loadWatchlist();
  loadSymbolDirectory();
  loadWorkspacePreferences();
  // Each chart URL starts from the indicators requested by analyze_kline.
  resetIndicatorVisibility();
  initChart();
  syncToggleButtons();
  try { kchart?.setLocale?.(viewLanguage === "en" ? "en-US" : "zh-CN"); } catch {}
  syncLanguageControls();
  setWatchlistRail(watchlistRailOpen, { persist: false });
  initViewScrollbar();
  initCanvasResizer();
  if (window.ResizeObserver) {
    viewResizeObserver = new ResizeObserver(() => {
      applyViewportHeight(null);
      if (isCanvasExpanded()) recalcChartHeight();
      else { reportSize(); scheduleChartResize(); }
    });
    viewResizeObserver.observe(document.getElementById("viewShell"));
    viewResizeObserver.observe(document.getElementById("viewContent"));
  }
  const payload = window.__DSH_CHART_SESSION__;
  if (!payload || !Array.isArray(payload.chartCommands)) {
    setChartStatus("图表会话不可用");
    showError("图表会话已失效，请在 dsh 中重新运行 analyze_kline。");
    return;
  }
  rememberAnalysisCommands(payload);
  await handleToolResult({ structuredContent: payload });
  startMarketTickerRefresh();
  startWatchlistQuoteRefresh();
  scheduleSymbolDirectoryRefresh();
  scheduleCommonIndexPrefetch();
  reportSize();
  setChartStatus("");
}
init().catch((error) => {
  console.error("dsh_kline chart init", error);
  showError(`图表初始化失败：${String(error?.message || error)}`);
});
</script>
